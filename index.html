<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planejamento Kazenski</title>
  <meta name="description" content="Planejamentos anuais, mensais e diários de Técnico em TI, com calendário letivo e apoio de IA.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="login-card">
      <div class="login-marca">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#FF5000"/><path d="M12 14h24v4H12zm0 8h16v4H12zm0 8h24v4H12z" fill="#fff"/></svg>
        <div>
          <strong>Planejamento Kazenski</strong>
          <span>Técnico em TI · planejamento anual, mensal e diário</span>
        </div>
      </div>
      <p class="muted">Entre com sua conta Google para acessar seus planejamentos.</p>
      <button class="btn primary full" id="btn-entrar" type="button">Entrar com Google</button>
      <!-- TEMPORÁRIO: acesso de teste por e-mail e senha. Remover antes do uso final. -->
      <details id="acesso-teste" class="acesso-teste">
        <summary>Acesso de teste (e-mail e senha)</summary>
        <form id="form-senha" class="form-senha">
          <label class="campo"><span>E-mail</span><input type="email" id="senha-email" autocomplete="username" required></label>
          <label class="campo"><span>Senha</span><input type="password" id="senha-valor" autocomplete="current-password" required></label>
          <button class="btn full" type="submit">Entrar com e-mail</button>
        </form>
      </details>
      <p id="login-erro" class="erro" hidden></p>
    </div>
  </section>

  <div id="app" class="layout" hidden>
    <header class="topbar">
      <a class="marca" href="#/painel">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#FF5000"/><path d="M12 14h24v4H12zm0 8h16v4H12zm0 8h24v4H12z" fill="#fff"/></svg>
        <span>Planejamento<small>Kazenski</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/painel" data-rota="painel">Painel</a>
        <a href="#/calendario" data-rota="calendario">Calendário</a>
        <a href="#/planos" data-rota="planos">Planos</a>
        <a href="#/materiais" data-rota="materiais">Materiais</a>
        <a href="#/colegios" data-rota="colegios">Colégios</a>
        <a href="#/turmas" data-rota="turmas">Turmas</a>
        <a href="#/disciplinas" data-rota="disciplinas">Disciplinas</a>
        <a href="#/aulas" data-rota="aulas">Aulas por disciplina</a>
        <a href="#/configuracoes" data-rota="configuracoes">Configurações</a>
      </nav>
      <div id="fila-status" class="fila-status" hidden></div>
      <div class="usuario">
        <span id="usuario-email" class="muted"></span>
        <button class="btn ghost" id="btn-sair" type="button">Sair</button>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <dialog id="dlg">
    <form id="dlg-form" class="dlg-form">
      <header>
        <h2 id="dlg-titulo"></h2>
        <button type="button" class="btn ghost icone" id="dlg-x" aria-label="Fechar">×</button>
      </header>
      <div id="dlg-corpo" class="dlg-corpo"></div>
      <footer>
        <span id="dlg-extra" class="dlg-extra"></span>
        <button type="button" class="btn" id="dlg-cancelar">Fechar</button>
        <button type="submit" class="btn primary" id="dlg-salvar">Salvar</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
